# Windows JDK 17+/JBR uses AF_UNIX sockets for NIO Pipe/Selector wakeups. On this
# workstation AF_UNIX listener creation succeeds but connect() returns EINVAL;
# an intentionally nonexistent directory makes the JDK use its TCP-loopback fallback.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en -Djdk.net.unixdomain.tmpdir=C:/RoadSide-af-unix-disabled
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
